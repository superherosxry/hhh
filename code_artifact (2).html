<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梦幻圣诞夜 · 虚幻光影圣诞树与烟花盛典</title>
    <!-- 引入 Tailwind CSS 用于响应式毛玻璃控制面板布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入优雅的中英文字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #030510;
            font-family: 'Noto Serif SC', serif;
            overscroll-behavior: none;
        }
        #sceneCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            inset: 0;
            z-index: 1;
            touch-action: none;
        }
        .font-festive {
            font-family: 'Cinzel Decorative', 'Noto Serif SC', serif;
        }
        /* 精致毛玻璃效果 */
        .glass-panel {
            background: rgba(12, 19, 44, 0.58);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.48);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 225, 150, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 210, 110, 0.22);
        }
        .glass-btn:active {
            transform: scale(0.95);
        }
        .glass-btn.active-gala {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.35), rgba(236, 72, 153, 0.35));
            border-color: rgba(253, 224, 71, 0.8);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }
        @keyframes floatGlow {
            0%, 100% { text-shadow: 0 0 14px rgba(255, 215, 110, 0.6), 0 0 28px rgba(255, 160, 60, 0.3); }
            50% { text-shadow: 0 0 22px rgba(255, 230, 150, 0.9), 0 0 40px rgba(255, 180, 80, 0.5); }
        }
        .title-glow {
            animation: floatGlow 3.5s ease-in-out infinite;
        }
        .ui-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .ui-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px);
        }
        /* 自定义细滚动条（许愿瓶列表） */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 130, 0.35);
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-white antialiased">

    <!-- 全屏交互主画布 -->
    <canvas id="sceneCanvas"></canvas>

    <!-- 顶部标题、圣诞实时倒计时与右上角功能区 -->
    <header class="fixed top-0 left-0 right-0 z-10 flex items-start justify-between p-4 pt-[max(1rem,env(safe-area-inset-top))] sm:p-6 pointer-events-none">
        <div id="headerTitle" class="ui-transition max-w-[60%] sm:max-w-none">
            <h1 class="font-festive text-lg sm:text-3xl font-bold tracking-wider text-amber-100 title-glow leading-tight">
                Merry Christmas
            </h1>
            <!-- 圣诞实时倒计时徽章 -->
            <div id="countdownBadge" class="inline-flex items-center gap-1.5 mt-1.5 px-2.5 py-0.5 rounded-full bg-white/10 border border-amber-200/25 text-[11px] sm:text-xs text-amber-200/95 backdrop-blur-md">
                <span>⏳</span>
                <span id="countdownText">正在计算圣诞倒计时...</span>
            </div>
            <p class="hidden sm:block text-xs text-blue-200/75 mt-1.5 tracking-widest">
                点击夜空放烟花 · 捕捉流星触发心形礼花 · 轻点树顶星星3次解锁彩蛋
            </p>
        </div>

        <!-- 右上角控制按钮组（始终可点击） -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 pointer-events-auto">
            <!-- 星尘许愿瓶按钮 -->
            <button id="openBottleBtn" aria-label="星尘许愿瓶"
                class="glass-btn relative rounded-full px-3 py-2 sm:px-3.5 sm:py-2.5 flex items-center gap-1.5 text-xs sm:text-sm font-medium text-amber-100 cursor-pointer">
                <span class="text-sm sm:text-base">🫙</span>
                <span class="hidden md:inline">星愿瓶</span>
                <span id="wishCountBadge" class="text-[10px] px-1.5 py-0.2 rounded-full bg-amber-400/30 text-amber-200 font-bold">0</span>
            </button>

            <!-- 音乐与音效开关 -->
            <button id="audioToggleBtn" aria-label="切换音乐与音效"
                class="glass-btn rounded-full px-3 py-2 sm:px-3.5 sm:py-2.5 flex items-center gap-1.5 text-xs sm:text-sm font-medium text-amber-100 cursor-pointer">
                <span id="audioIcon" class="text-sm sm:text-base">🔇</span>
                <span id="audioText" class="hidden md:inline">开启音乐</span>
            </button>

            <!-- 隐藏/显示面板按钮（纯净观赏模式） -->
            <button id="toggleUiBtn" aria-label="隐藏或显示界面"
                class="glass-btn rounded-full p-2 sm:px-3.5 sm:py-2.5 flex items-center gap-1.5 text-xs sm:text-sm text-blue-100 cursor-pointer">
                <svg id="eyeIcon" class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <span id="toggleUiText" class="hidden md:inline">纯净模式</span>
            </button>
        </div>
    </header>

    <!-- 盛典进行中横幅提示 -->
    <div id="galaBanner" class="fixed top-20 sm:top-24 left-1/2 -translate-x-1/2 z-10 pointer-events-none opacity-0 transition-opacity duration-500">
        <div class="glass-panel px-4 py-1.5 rounded-full border border-amber-300/50 text-xs sm:text-sm text-amber-200 font-semibold tracking-wider shadow-lg flex items-center gap-2">
            <span>🎆</span>
            <span id="galaBannerText">圣诞烟花盛典进行中 · 15s</span>
        </div>
    </div>

    <!-- 专属祝福贺卡横幅（通过 ?to=&msg= 参数打开时自动呈现） -->
    <div id="greetingCardBanner" class="fixed top-24 sm:top-28 left-1/2 -translate-x-1/2 z-20 hidden w-[90%] max-w-md">
        <div class="glass-panel rounded-3xl p-5 text-center border border-amber-300/45 shadow-2xl relative">
            <button id="closeGreetingBannerBtn" aria-label="关闭祝福卡片"
                class="absolute top-3 right-3.5 text-blue-200/70 hover:text-white text-sm cursor-pointer p-1">✕</button>
            <div class="text-xs tracking-widest text-amber-300/90 mb-1">✨ 收到一份专属圣诞夜祝福 ✨</div>
            <h2 id="greetingToTitle" class="text-lg sm:text-xl font-bold text-amber-100 mb-2">To: 特别的你</h2>
            <p id="greetingMsgBody" class="text-sm sm:text-base text-blue-100/95 leading-relaxed mb-3">
                愿这个冬夜的烟花与星光，为你照亮新一年的所有美好！
            </p>
            <button id="replayGreetingFireworkBtn"
                class="px-4 py-1.5 rounded-full bg-amber-400/25 hover:bg-amber-400/40 border border-amber-300/40 text-xs text-amber-100 transition cursor-pointer">
                💖 再放一次心形烟花
            </button>
        </div>
    </div>

    <!-- 底部毛玻璃控制栏（适配手机与电脑，4大核心功能） -->
    <footer id="controlDock" class="fixed bottom-4 bottom-[max(1rem,env(safe-area-inset-bottom))] sm:bottom-6 left-1/2 -translate-x-1/2 z-10 w-[95%] max-w-2xl ui-transition">
        <div class="glass-panel rounded-2xl sm:rounded-3xl p-2 sm:p-3 grid grid-cols-4 gap-1.5 sm:gap-2.5">
            
            <!-- 1. 一键盛典按钮 -->
            <button id="galaShowBtn"
                class="glass-btn rounded-xl sm:rounded-2xl py-2 sm:py-2.5 px-1.5 sm:px-3 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5 text-amber-200 font-semibold text-[11px] sm:text-sm cursor-pointer">
                <span class="text-base sm:text-lg">🎆</span>
                <span id="galaBtnLabel">一键盛典</span>
            </button>

            <!-- 2. 灯光主题切换按钮 -->
            <button id="themeSwitchBtn"
                class="glass-btn rounded-xl sm:rounded-2xl py-2 sm:py-2.5 px-1.5 sm:px-3 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5 text-cyan-200 font-semibold text-[11px] sm:text-sm cursor-pointer">
                <span class="text-base sm:text-lg">🎄</span>
                <span id="themeNameLabel" class="truncate max-w-full">流金星尘</span>
            </button>

            <!-- 3. 放飞许愿灯按钮 -->
            <button id="openWishBtn"
                class="glass-btn rounded-xl sm:rounded-2xl py-2 sm:py-2.5 px-1.5 sm:px-3 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5 text-rose-200 font-semibold text-[11px] sm:text-sm cursor-pointer">
                <span class="text-base sm:text-lg">🏮</span>
                <span>许愿天灯</span>
            </button>

            <!-- 4. 专属祝福链接生成器按钮 -->
            <button id="openShareBtn"
                class="glass-btn rounded-xl sm:rounded-2xl py-2 sm:py-2.5 px-1.5 sm:px-3 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-1.5 text-purple-200 font-semibold text-[11px] sm:text-sm cursor-pointer">
                <span class="text-base sm:text-lg">💌</span>
                <span>专属祝福</span>
            </button>

        </div>
    </footer>

    <!-- 弹窗 1：放飞许愿灯输入弹窗 -->
    <div id="wishModal" class="fixed inset-0 z-20 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 text-center relative border border-amber-300/30">
            <h2 class="text-xl font-bold text-amber-200 mb-1">✨ 写下你的圣诞心愿</h2>
            <p class="text-xs text-blue-200/80 mb-4">心愿将化作温暖天灯缓缓升空，并存入星愿瓶</p>
            
            <input id="wishInput" type="text" maxlength="24" placeholder="例如：愿家人平安喜乐，万事胜意..."
                class="w-full rounded-xl bg-white/10 border border-white/25 px-4 py-3 text-sm text-white placeholder-blue-200/50 focus:outline-none focus:border-amber-300 mb-3 text-center">
            
            <!-- 快捷心愿标签 -->
            <div class="flex flex-wrap justify-center gap-1.5 mb-5">
                <button type="button" class="quick-wish text-xs px-2.5 py-1 rounded-full bg-white/10 hover:bg-amber-400/25 text-amber-100 border border-white/15 transition cursor-pointer">平安喜乐 ✨</button>
                <button type="button" class="quick-wish text-xs px-2.5 py-1 rounded-full bg-white/10 hover:bg-amber-400/25 text-amber-100 border border-white/15 transition cursor-pointer">暴富暴美 🎁</button>
                <button type="button" class="quick-wish text-xs px-2.5 py-1 rounded-full bg-white/10 hover:bg-amber-400/25 text-amber-100 border border-white/15 transition cursor-pointer">得偿所愿 🌟</button>
                <button type="button" class="quick-wish text-xs px-2.5 py-1 rounded-full bg-white/10 hover:bg-amber-400/25 text-amber-100 border border-white/15 transition cursor-pointer">圣诞快乐 🎄</button>
            </div>

            <div class="flex gap-3">
                <button id="cancelWishBtn"
                    class="flex-1 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm text-gray-200 transition cursor-pointer">
                    取消
                </button>
                <button id="sendWishBtn"
                    class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/30 transition cursor-pointer">
                    放飞心愿 🏮
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 2：专属祝福链接生成器弹窗 -->
    <div id="shareModal" class="fixed inset-0 z-20 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 text-center relative border border-purple-300/30">
            <h2 class="text-xl font-bold text-amber-200 mb-1">💌 定制专属圣诞祝福网址</h2>
            <p class="text-xs text-blue-200/80 mb-4">填写对方昵称与祝福语，生成专属链接发给TA，打开即放心形烟花</p>

            <div class="space-y-3 mb-4 text-left">
                <div>
                    <label class="block text-xs text-blue-200/90 mb-1 ml-1">送给谁（对方昵称）：</label>
                    <input id="shareToInput" type="text" maxlength="16" placeholder="例如：小美 / 亲爱的 / 最好的朋友"
                        class="w-full rounded-xl bg-white/10 border border-white/25 px-3.5 py-2.5 text-sm text-white placeholder-blue-200/45 focus:outline-none focus:border-amber-300">
                </div>
                <div>
                    <label class="block text-xs text-blue-200/90 mb-1 ml-1">秘密圣诞寄语：</label>
                    <input id="shareMsgInput" type="text" maxlength="36" placeholder="例如：愿岁岁年年，万喜万般宜，圣诞快乐！"
                        class="w-full rounded-xl bg-white/10 border border-white/25 px-3.5 py-2.5 text-sm text-white placeholder-blue-200/45 focus:outline-none focus:border-amber-300">
                </div>
            </div>

            <!-- 生成结果预览框 -->
            <div class="bg-black/30 rounded-xl p-2.5 mb-4 border border-white/10">
                <input id="generatedShareUrl" type="text" readonly
                    class="w-full bg-transparent text-[11px] text-amber-200/90 focus:outline-none text-center select-all">
            </div>

            <div class="flex gap-3">
                <button id="cancelShareBtn"
                    class="flex-1 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm text-gray-200 transition cursor-pointer">
                    关闭
                </button>
                <button id="copyShareUrlBtn"
                    class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-amber-500 hover:from-pink-400 hover:to-amber-400 text-slate-950 font-bold text-sm shadow-lg shadow-pink-500/25 transition cursor-pointer">
                    复制专属链接 📋
                </button>
            </div>
        </div>
    </div>

    <!-- 弹窗 3：星尘许愿瓶记录弹窗 -->
    <div id="bottleModal" class="fixed inset-0 z-20 hidden items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity">
        <div class="glass-panel w-full max-w-md rounded-3xl p-6 text-center relative border border-amber-300/30">
            <h2 class="text-xl font-bold text-amber-200 mb-1">🫙 星尘许愿瓶</h2>
            <p class="text-xs text-blue-200/80 mb-4">这里珍藏着你在圣诞夜放飞的所有心愿</p>

            <div id="wishHistoryList" class="max-h-60 overflow-y-auto custom-scroll space-y-2 mb-5 text-left px-1">
                <!-- 动态渲染愿望清单 -->
            </div>

            <div class="flex gap-3">
                <button id="closeBottleBtn"
                    class="flex-1 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-sm text-gray-200 transition cursor-pointer">
                    收起星愿瓶
                </button>
                <button id="relaunchAllWishesBtn"
                    class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/25 transition cursor-pointer">
                    重放全部心愿 ✨
                </button>
            </div>
        </div>
    </div>

    <!-- 轻提示 Toast 消息框 -->
    <div id="toastMsg" class="fixed top-20 left-1/2 -translate-x-1/2 z-30 pointer-events-none opacity-0 transition-opacity duration-300">
        <div class="glass-panel px-4 py-2 rounded-full text-xs sm:text-sm text-amber-200 border border-amber-300/30 shadow-lg whitespace-nowrap">
            提示信息
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. Web Audio API 圣诞纯音乐（空灵钢琴八音盒 + 温暖和弦垫 + 烟花音效）
         * ============================================================================
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.reverbSend = null;
                this.isPlaying = false;
                this.noteTimer = null;
                this.step = 0;

                // 舒缓版圣诞纯音乐乐章：《平安夜 Silent Night》+《铃儿响叮当》梦幻变奏
                this.melody = [
                    // 第一乐段：《平安夜 Silent Night》空灵前奏与主歌（3/4拍 华尔兹律动）
                    [392.00, 1.5, 130.81], [440.00, 0.5, 0], [392.00, 1.0, 0],
                    [329.63, 3.0, 164.81],
                    [392.00, 1.5, 130.81], [440.00, 0.5, 0], [392.00, 1.0, 0],
                    [329.63, 3.0, 164.81],

                    [587.33, 2.0, 146.83], [587.33, 1.0, 0],
                    [493.88, 3.0, 196.00],
                    [523.25, 2.0, 130.81], [523.25, 1.0, 0],
                    [392.00, 3.0, 164.81],

                    [440.00, 2.0, 174.61], [440.00, 1.0, 0],
                    [523.25, 1.5, 174.61], [493.88, 0.5, 0], [440.00, 1.0, 0],
                    [392.00, 1.5, 130.81], [440.00, 0.5, 0], [392.00, 1.0, 0],
                    [329.63, 3.0, 164.81],

                    [587.33, 2.0, 146.83], [587.33, 1.0, 0],
                    [698.46, 1.5, 196.00], [587.33, 0.5, 0], [493.88, 1.0, 0],
                    [523.25, 3.0, 130.81],
                    [659.25, 3.0, 164.81],

                    [523.25, 1.5, 130.81], [392.00, 0.5, 0], [329.63, 1.0, 0],
                    [392.00, 1.5, 196.00], [349.23, 0.5, 0], [293.66, 1.0, 0],
                    [261.63, 4.5, 130.81], [0, 1.5, 0],

                    // 第二乐段：《铃儿响叮当》八音盒星光变奏（轻柔慢板）
                    [659.25, 1.0, 130.81], [659.25, 1.0, 0], [659.25, 2.0, 164.81],
                    [659.25, 1.0, 130.81], [659.25, 1.0, 0], [659.25, 2.0, 164.81],
                    [659.25, 1.0, 130.81], [783.99, 1.0, 0], [523.25, 1.5, 174.61], [587.33, 0.5, 0],
                    [659.25, 3.5, 130.81], [0, 0.5, 0],

                    [698.46, 1.0, 174.61], [698.46, 1.0, 0], [698.46, 1.5, 174.61], [698.46, 0.5, 0],
                    [698.46, 1.0, 130.81], [659.25, 1.0, 0], [659.25, 1.5, 164.81], [659.25, 0.5, 0],
                    [783.99, 1.0, 196.00], [783.99, 1.0, 0], [698.46, 1.0, 0], [587.33, 1.0, 0],
                    [523.25, 4.5, 130.81], [0, 1.5, 0]
                ];
            }

            initAudioGraph() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
                this.masterGain.connect(this.ctx.destination);

                // 立体声回声延迟总线
                const delay = this.ctx.createDelay(1.0);
                delay.delayTime.setValueAtTime(0.42, this.ctx.currentTime);

                const feedback = this.ctx.createGain();
                feedback.gain.setValueAtTime(0.36, this.ctx.currentTime);

                const wetFilter = this.ctx.createBiquadFilter();
                wetFilter.type = 'lowpass';
                wetFilter.frequency.setValueAtTime(1800, this.ctx.currentTime);

                this.reverbSend = this.ctx.createGain();
                this.reverbSend.gain.setValueAtTime(0.35, this.ctx.currentTime);

                this.reverbSend.connect(delay);
                delay.connect(wetFilter);
                wetFilter.connect(feedback);
                feedback.connect(delay);
                wetFilter.connect(this.masterGain);
            }

            toggle() {
                this.initAudioGraph();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                this.isPlaying = !this.isPlaying;
                if (this.isPlaying) {
                    this.scheduleNextNote();
                } else {
                    clearTimeout(this.noteTimer);
                }
                return this.isPlaying;
            }

            playMusicBoxTone(freq, durationSec) {
                if (!this.ctx || !this.isPlaying || freq <= 0) return;
                const now = this.ctx.currentTime;
                const release = Math.max(1.4, durationSec * 1.85);

                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const noteGain = this.ctx.createGain();

                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(freq, now);

                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(freq * 2, now);
                const overtoneGain = this.ctx.createGain();
                overtoneGain.gain.setValueAtTime(0.14, now);
                overtoneGain.gain.exponentialRampToValueAtTime(0.001, now + release * 0.65);

                noteGain.gain.setValueAtTime(0.0008, now);
                noteGain.gain.linearRampToValueAtTime(0.095, now + 0.035);
                noteGain.gain.exponentialRampToValueAtTime(0.0008, now + release);

                osc1.connect(noteGain);
                osc2.connect(overtoneGain);
                overtoneGain.connect(noteGain);

                noteGain.connect(this.masterGain);
                noteGain.connect(this.reverbSend);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + release + 0.05);
                osc2.stop(now + release + 0.05);
            }

            playWarmPad(bassFreq, durationSec) {
                if (!this.ctx || !this.isPlaying || !bassFreq || bassFreq <= 0) return;
                const now = this.ctx.currentTime;
                const padDuration = Math.max(2.2, durationSec * 2.8);

                const freqs = [bassFreq, bassFreq * 1.498, bassFreq * 2];
                freqs.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const filter = this.ctx.createBiquadFilter();
                    const padGain = this.ctx.createGain();

                    osc.type = idx === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(520, now);

                    const peak = idx === 0 ? 0.055 : 0.024;
                    padGain.gain.setValueAtTime(0.0005, now);
                    padGain.gain.linearRampToValueAtTime(peak, now + 0.45);
                    padGain.gain.exponentialRampToValueAtTime(0.0005, now + padDuration);

                    osc.connect(filter);
                    filter.connect(padGain);
                    padGain.connect(this.masterGain);
                    padGain.connect(this.reverbSend);

                    osc.start(now);
                    osc.stop(now + padDuration + 0.05);
                });
            }

            playChimeSparkle() {
                if (!this.ctx || !this.isPlaying) return;
                const notes = [1046.5, 1318.5, 1567.98, 2093.0];
                notes.forEach((f, idx) => {
                    setTimeout(() => this.playMusicBoxTone(f, 0.5), idx * 75);
                });
            }

            scheduleNextNote() {
                if (!this.isPlaying) return;
                const [freq, beats, bassFreq] = this.melody[this.step % this.melody.length];
                const beatDuration = 0.56;
                const duration = beats * beatDuration;

                this.playMusicBoxTone(freq, duration);
                if (bassFreq) {
                    this.playWarmPad(bassFreq, duration);
                }

                this.step++;
                this.noteTimer = setTimeout(() => this.scheduleNextNote(), duration * 1000);
            }

            playFireworkPop(intensity = 1) {
                if (!this.ctx || !this.isPlaying) return;
                try {
                    const now = this.ctx.currentTime;
                    const bufferSize = this.ctx.sampleRate * 0.5;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.11));
                    }

                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(320 * intensity, now);
                    filter.frequency.exponentialRampToValueAtTime(80, now + 0.45);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.11 * intensity, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.masterGain);
                    gain.connect(this.reverbSend);

                    noise.start(now);
                } catch (e) {}
            }
        }

        function buildEtherealChristmasTree() {
            treeElements = [];
            ribbonStrips = [];
            floatingWisps = [];

            const isMobile = width < 640;
            const treeHeight = Math.min(height * (isMobile ? 0.56 : 0.64), isMobile ? 430 : 560);
            const maxRadius = Math.min(width * (isMobile ? 0.36 : 0.23), treeHeight * 0.45);
            const tierCount = 7;

            const getEtherealRadius = (t) => {
                const wave = Math.sin(t * Math.PI * tierCount) * 0.065 * Math.pow(t, 0.65);
                const cone = Math.pow(t, 0.88) * 0.94;
                return maxRadius * Math.max(0.015, cone + wave);
            };

            // 1. 虚幻光束树芯
            const coreBeamCount = isMobile ? 65 : 95;
            for (let i = 0; i < coreBeamCount; i++) {
                const t = Math.random();
                const angle = Math.random() * Math.PI * 2;
                const r = maxRadius * 0.14 * Math.pow(t, 0.6) * Math.random();
                treeElements.push({
                    type: 'coreDust',
                    y: -treeHeight * 0.48 + t * treeHeight * 1.04,
                    t,
                    radius: r,
                    angle,
                    phase: Math.random() * Math.PI * 2,
                    speed: 1.5 + Math.random() * 2.5,
                    size: (isMobile ? 1.8 : 2.3) * (0.6 + Math.random() * 0.9)
                });
            }

            // 2. 虚幻星尘粒子树冠
            const stardustCount = isMobile ? 620 : 960;
            for (let i = 0; i < stardustCount; i++) {
                const t = Math.pow(Math.random(), 0.82);
                const surfaceR = getEtherealRadius(t);
                const shellFactor = Math.random() < 0.82
                    ? (0.86 + Math.random() * 0.16)
                    : (0.25 + Math.random() * 0.62);
                const r = surfaceR * shellFactor;
                const angle = Math.random() * Math.PI * 2;

                treeElements.push({
                    type: 'stardust',
                    y: -treeHeight * 0.5 + t * treeHeight,
                    radius: r,
                    angle,
                    t,
                    shellFactor,
                    phase: Math.random() * Math.PI * 2,
                    speed: 1.4 + Math.random() * 2.6,
                    size: (isMobile ? 1.6 : 2.1) * (0.65 + Math.random() * 0.95)
                });
            }

            // 3. 三重螺旋全息流光丝带
            const ribbonConfigs = [
                { turns: 4.2, phase: 0, widthScale: 1.15, radiusScale: 1.01 },
                { turns: 4.2, phase: Math.PI * 0.66, widthScale: 0.75, radiusScale: 0.98 },
                { turns: 4.2, phase: Math.PI * 1.33, widthScale: 0.75, radiusScale: 0.98 }
            ];
            const ribbonSteps = isMobile ? 160 : 220;

            ribbonConfigs.forEach((cfg) => {
                const strip = [];
                for (let i = 0; i <= ribbonSteps; i++) {
                    const t = 0.02 + (i / ribbonSteps) * 0.96;
                    const r = getEtherealRadius(t) * cfg.radiusScale;
                    const angle = t * Math.PI * 2 * cfg.turns + cfg.phase;
                    const y = -treeHeight * 0.5 + t * treeHeight;
                    strip.push({ t, y, radius: r, angle, widthScale: cfg.widthScale });
                }
                ribbonStrips.push(strip);
            });

            // 4. 梦幻散景光斑（Bokeh Orbs）
            const bokehCount = isMobile ? 95 : 145;
            for (let i = 0; i < bokehCount; i++) {
                const t = 0.06 + Math.pow(Math.random(), 0.9) * 0.91;
                const r = getEtherealRadius(t) * (0.85 + Math.random() * 0.22);
                const angle = i * 2.39996 + (Math.random() - 0.5) * 0.3;
                treeElements.push({
                    type: 'bokehOrb',
                    y: -treeHeight * 0.5 + t * treeHeight,
                    t,
                    radius: r,
                    angle,
                    colorIdx: i % 4,
                    twinklePhase: Math.random() * Math.PI * 2,
                    twinkleSpeed: 1.8 + Math.random() * 2.4,
                    size: (isMobile ? 4.2 : 5.6) * (0.7 + Math.random() * 0.75)
                });
            }

            // 5. 围绕树身盘旋上升的虚幻萤火光灵
            const wispCount = isMobile ? 28 : 42;
            for (let i = 0; i < wispCount; i++) {
                floatingWisps.push({
                    t: Math.random(),
                    angle: Math.random() * Math.PI * 2,
                    radialOffset: 1.06 + Math.random() * 0.32,
                    riseSpeed: 0.0012 + Math.random() * 0.0016,
                    orbitSpeed: 0.008 + Math.random() * 0.012,
                    phase: Math.random() * Math.PI * 2,
                    size: (isMobile ? 2.0 : 2.6) * (0.7 + Math.random() * 0.8)
                });
            }

            buildEtherealChristmasTree.meta = {
                treeHeight,
                maxRadius,
                getEtherealRadius
            };
        }

        /**
         * ============================================================================

         * ============================================================================

        class ShootingStar {
            constructor() {
                const fromLeft = Math.random() > 0.35;
                this.x = fromLeft ? Math.random() * width * 0.45 : width * (0.55 + Math.random() * 0.4);
                this.y = height * (0.04 + Math.random() * 0.16);
                const angle = fromLeft ? (0.32 + Math.random() * 0.22) : (Math.PI - 0.32 - Math.random() * 0.22);
                const speed = 5.2 + Math.random() * 2.4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.length = 95 + Math.random() * 55;
                this.life = 1.0;
                this.decay = 0.0085 + Math.random() * 0.004;
                this.caught = false;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const norm = Math.hypot(this.vx, this.vy);
                const tailX = this.x - (this.vx / norm) * this.length;
                const tailY = this.y - (this.vy / norm) * this.length;

                const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                grad.addColorStop(0, `rgba(255, 252, 225, ${this.life})`);
                grad.addColorStop(0.35, `rgba(180, 230, 255, ${this.life * 0.55})`);
                grad.addColorStop(1, 'rgba(120, 180, 255, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 2.4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                // 流星头部亮星核
                ctx.fillStyle = `rgba(255, 255, 255, ${this.life})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.8, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FireworkRocket {
            constructor(startX, targetX, targetY, forceShape = null, customHue = null) {
                this.x = startX;
                this.y = height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.forceShape = forceShape; // 'heart' | 'ring' | null

                const dx = targetX - startX;
                const dy = targetY - height;
                const distance = Math.hypot(dx, dy);
                const speed = Math.max(9.5, distance * 0.022);
                const angle = Math.atan2(dy, dx);

                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.hue = customHue !== null ? customHue : Math.floor(Math.random() * 360);
                this.trail = [];
                this.exploded = false;
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 8) this.trail.shift();

                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.06;

                const distToTarget = Math.hypot(this.targetX - this.x, this.targetY - this.y);
                if (distToTarget < 18 || this.vy >= -0.8) {
                    this.exploded = true;
                    explodeFirework(this.x, this.y, this.hue, this.forceShape);
                }
            }

            draw() {
                ctx.save();
                for (let i = 0; i < this.trail.length; i++) {
                    const pt = this.trail[i];
                    const ratio = (i + 1) / this.trail.length;
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 75%, ${ratio * 0.75})`;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, ratio * 2.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        function explodeFirework(x, y, baseHue, forceShape = null) {
            soundEngine.playFireworkPop(0.85 + Math.random() * 0.4);

            skyFlashAlpha = 0.16;

            const isMobile = width < 640;
            const shape = forceShape || (Math.random() > 0.85 ? 'heart' : (Math.random() > 0.65 ? 'ring' : 'burst'));

            if (shape === 'heart') {
                // 浪漫心形烟花参数方程
                const heartCount = isMobile ? 76 : 110;
                const scale = isMobile ? 0.24 : 0.31;
                const heartHue = forceShape === 'heart' ? 342 : baseHue;

                for (let i = 0; i < heartCount; i++) {
                    const t = (Math.PI * 2 * i) / heartCount;
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                    const jitter = 0.92 + Math.random() * 0.16;

                    fireworkParticles.push({
                        x,
                        y,
                        vx: hx * scale * jitter,
                        vy: hy * scale * jitter,
                        hue: (heartHue + (Math.random() - 0.5) * 24 + 360) % 360,
                        lightness: 68 + Math.random() * 20,
                        alpha: 1,
                        decay: 0.0048 + Math.random() * 0.0038,
                        gravity: 0.022,
                        drag: 0.974,
                        sparkle: true,
                        history: []
                    });
                }
                return;
            }

            const count = isMobile ? 68 : 108;
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.15;
                let speed = (Math.random() * 3.8 + 1.4) * (isMobile ? 0.82 : 1.05);

                if (shape === 'ring') {

                const hue = (baseHue + (Math.random() - 0.5) * 42 + 360) % 360;
                fireworkParticles.push({

                    sparkle: Math.random() > 0.3,
