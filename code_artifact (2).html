                this.alpha = 0;
            }

            update() {
                this.y += this.vy;
                this.swayPhase += 0.015;
                this.x += Math.sin(this.swayPhase) * 0.32 + windVelocity * 0.12;
                if (this.alpha < 1 && this.y > height * 0.14) {
                    this.alpha = Math.min(1, this.alpha + 0.016);
                }
                if (this.y < height * 0.12) {
                    this.alpha -= 0.0045;
                }
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                const glow = ctx.createRadialGradient(0, 2, 3, 0, 2, 66);
                glow.addColorStop(0, 'rgba(255, 224, 135, 0.65)');
                glow.addColorStop(0.45, 'rgba(255, 145, 55, 0.26)');
                glow.addColorStop(0.78, 'rgba(255, 105, 35, 0.08)');
                glow.addColorStop(1, 'rgba(255, 100, 30, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 2, 66, 0, Math.PI * 2);
                ctx.fill();

                const w = 34;
                const h = 42;
                const bodyGrad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
                bodyGrad.addColorStop(0, '#FF8533');
                bodyGrad.addColorStop(0.48, '#FFC44D');
                bodyGrad.addColorStop(1, '#FFF6C4');

                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.moveTo(-w * 0.36, -h / 2);
                ctx.quadraticCurveTo(0, -h * 0.58, w * 0.36, -h / 2);
                ctx.bezierCurveTo(w * 0.62, -h * 0.15, w * 0.52, h * 0.25, w * 0.32, h / 2);
                ctx.lineTo(-w * 0.32, h / 2);
                ctx.bezierCurveTo(-w * 0.52, h * 0.25, -w * 0.62, -h * 0.15, -w * 0.36, -h / 2);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(180, 75, 15, 0.28)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, -h * 0.52);
                ctx.lineTo(0, h * 0.5);
                ctx.moveTo(-w * 0.24, -h * 0.48);
                ctx.quadraticCurveTo(-w * 0.32, 0, -w * 0.16, h * 0.5);
                ctx.moveTo(w * 0.24, -h * 0.48);
                ctx.quadraticCurveTo(w * 0.32, 0, w * 0.16, h * 0.5);
                ctx.stroke();

                ctx.fillStyle = '#8C3B0A';
                ctx.fillRect(-w * 0.22, h / 2 - 1, w * 0.44, 3);
                ctx.fillStyle = '#FFFDF0';
                ctx.beginPath();
                ctx.arc(0, h * 0.26, 3.2, 0, Math.PI * 2);
                ctx.fill();

                if (this.text) {
                    ctx.font = '700 13px "Noto Serif SC", serif';
                    ctx.textAlign = 'center';
                    const textWidth = ctx.measureText(this.text).width + 16;
                    const labelY = -h / 2 - 15;

                    ctx.fillStyle = 'rgba(12, 19, 44, 0.58)';
                    ctx.beginPath();
                    ctx.roundRect(-textWidth / 2, labelY - 12, textWidth, 18, 9);
                    ctx.fill();

                    ctx.fillStyle = '#FFF3C4';
                    ctx.shadowColor = 'rgba(255, 165, 50, 0.6)';
                    ctx.shadowBlur = 6;
                    ctx.fillText(this.text, 0, labelY + 1);
                }

                ctx.restore();
            }
        }

        /**
         * ============================================================================
         * 5. 主渲染循环（夜空、流动极光、流星雨、虚幻圣诞树、烟花与风吹雪花）
         * ============================================================================
         */
        let lastAutoFireworkTime = 0;
        let lastShootingStarTime = 0;

        function render(timestamp) {
            requestAnimationFrame(render);

            const theme = availableThemes[currentThemeIdx];
            const timeSec = timestamp * 0.001;

            // 1. 绘制深邃冬夜渐变天空
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#030613');
            skyGrad.addColorStop(0.52, '#091330');
            skyGrad.addColorStop(0.86, '#102046');
            skyGrad.addColorStop(1, '#162952');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // 2. 绘制夜空上方流动的半透明北极光幕布
            drawAuroraCurtains(timeSec, theme);

            // 烟花绽放时的夜空瞬时辉光
            if (skyFlashAlpha > 0.002) {
                ctx.save();
                ctx.globalAlpha = skyFlashAlpha;
                ctx.fillStyle = `hsl(${skyFlashHue}, 90%, 65%)`;
                ctx.fillRect(0, 0, width, height);
                ctx.restore();
                skyFlashAlpha *= 0.91;
            }

            // 3. 绘制闪烁星辰
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.phase += s.speed;
                const alpha = 0.25 + (Math.sin(s.phase) + 1) * 0.37;
                ctx.fillStyle = `rgba(235, 245, 255, ${alpha.toFixed(2)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 4. 偶发流星雨生成与更新（每约 9~13 秒划过一颗）
            if (timestamp - lastShootingStarTime > 9500) {
                lastShootingStarTime = timestamp + Math.random() * 3500;
                shootingStars.push(new ShootingStar());
            }
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                shootingStars[i].update();
                shootingStars[i].draw();
                if (shootingStars[i].life <= 0) {
                    shootingStars.splice(i, 1);
                }
            }

            // 5. 自动烟花 & 15秒一键盛典连发调度
            if (galaActive) {
                const remainSec = Math.max(0, Math.ceil((galaEndTime - timestamp) / 1000));
                document.getElementById('galaBannerText').textContent = `圣诞烟花盛典进行中 · ${remainSec}s`;

                if (timestamp >= galaEndTime) {
                    stopGalaShow();
                } else if (timestamp - lastGalaVolleyTime > 520) {
                    lastGalaVolleyTime = timestamp;
                    const tx = width * (0.14 + Math.random() * 0.72);
                    const ty = height * (0.12 + Math.random() * 0.36);
                    const special = Math.random() > 0.72 ? 'heart' : null;
                    launchFireworkTo(tx, ty, special);
                }
            } else if (timestamp - lastAutoFireworkTime > 2300) {
                lastAutoFireworkTime = timestamp;
                const tx = width * (0.15 + Math.random() * 0.7);
                const ty = height * (0.12 + Math.random() * 0.34);
                launchFireworkTo(tx, ty);
            }

            // 6. 更新并绘制烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].exploded) {
                    fireworks.splice(i, 1);
                }
            }

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                const p = fireworkParticles[i];
                p.history.push({ x: p.x, y: p.y });
                if (p.history.length > 9) p.history.shift();

                p.vx *= p.drag;
                p.vy *= p.drag;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.alpha <= 0.02) {
                    fireworkParticles.splice(i, 1);
                    continue;
                }

                if (p.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(p.history[0].x, p.history[0].y);
                    for (let j = 1; j < p.history.length; j++) {
                        ctx.lineTo(p.history[j].x, p.history[j].y);
                    }
                    ctx.strokeStyle = `hsla(${p.hue}, 100%, ${p.lightness}%, ${p.alpha * 0.55})`;
                    ctx.lineWidth = 1.6;
                    ctx.stroke();
                }

                const flicker = p.sparkle && Math.random() > 0.7 ? 0.3 : 1;
                ctx.fillStyle = `hsla(${p.hue}, 100%, ${p.lightness + 10}%, ${p.alpha * flicker})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // 7. 绘制远景雪丘与近景雪地
            const meta = buildEtherealChristmasTree.meta;
            const centerX = width * 0.5;
            const centerY = height * (width < 640 ? 0.48 : 0.49);
            const groundY = centerY + meta.treeHeight * 0.54;

            ctx.fillStyle = '#09132B';
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, groundY - 14);
            ctx.quadraticCurveTo(width * 0.24, groundY - 46, width * 0.52, groundY - 12);
            ctx.quadraticCurveTo(width * 0.80, groundY + 14, width, groundY - 26);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            const snowGroundGrad = ctx.createLinearGradient(0, groundY - 20, 0, height);
            snowGroundGrad.addColorStop(0, '#0E1D3D');
            snowGroundGrad.addColorStop(0.4, '#142750');
            snowGroundGrad.addColorStop(1, '#1B3366');
            ctx.fillStyle = snowGroundGrad;
            ctx.beginPath();
            ctx.ellipse(centerX, height + 40, width * 0.82, Math.max(95, height - groundY + 58), 0, Math.PI, Math.PI * 2);
            ctx.fill();

            // 树体背后的虚幻空灵光雾
            const auraPulse = 1 + Math.sin(timeSec * 1.6) * 0.06;
            const treeBackGlow = ctx.createRadialGradient(
                centerX, centerY, 8,
                centerX, centerY, meta.treeHeight * 0.66 * auraPulse
            );
            treeBackGlow.addColorStop(0, theme.auraInner);
            treeBackGlow.addColorStop(0.55, theme.treeGlow);
            treeBackGlow.addColorStop(1, theme.auraOuter);
            ctx.fillStyle = treeBackGlow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, meta.treeHeight * 0.66 * auraPulse, 0, Math.PI * 2);
            ctx.fill();

            // 8. 更新旋转物理惯性与微风摇曳
            if (!isDragging) {
                rotationAngle += angularVelocity;
                angularVelocity += (0.005 - angularVelocity) * 0.03;
            }
            windVelocity *= 0.96; // 微风自然平息

            const fov = 740;

            drawEtherealBaseRings(centerX, groundY, meta, theme, timeSec);
            drawEtherealVeil(centerX, centerY, meta, theme);

            // 计算所有 3D 星尘与光斑粒子（受微风轻微吹拂树梢倾斜）
            const projected = new Array(treeElements.length);
            for (let i = 0; i < treeElements.length; i++) {
                const p = treeElements[i];
                const theta = p.angle + rotationAngle;
                const swayX = windVelocity * Math.pow(1 - (p.t || 0.5), 1.5) * 14;
                const x3d = Math.cos(theta) * p.radius + swayX;
                const z3d = Math.sin(theta) * p.radius;
                const scale = fov / (fov + z3d);
                projected[i] = {
                    p,
                    x2d: centerX + x3d * scale,
                    y2d: centerY + p.y * scale,
                    z3d,
                    scale
                };
            }

            projected.sort((a, b) => b.z3d - a.z3d);

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            drawEtherealRibbons(centerX, centerY, fov, theme, timeSec, true);

            for (let i = 0; i < projected.length; i++) {
                const { p, x2d, y2d, z3d, scale } = projected[i];
                const depthFade = z3d > 0
                    ? Math.max(0.22, 0.65 - (z3d / meta.maxRadius) * 0.42)
                    : Math.min(1, 0.78 + (-z3d / meta.maxRadius) * 0.25);

                if (p.type === 'coreDust') {
                    const pulse = 0.45 + 0.55 * Math.sin(timeSec * p.speed + p.phase);
                    const r = p.size * scale;
                    ctx.fillStyle = `hsla(${theme.spiritHue}, 95%, 80%, ${0.32 * pulse * depthFade})`;
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, r * 1.8, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'stardust') {
                    const twinkle = 0.45 + 0.55 * Math.sin(timeSec * p.speed + p.phase);
                    const r = p.size * scale * (0.85 + twinkle * 0.3);
                    const hue = p.shellFactor > 0.9 ? theme.spiritHue : theme.spiritAccentHue;
                    const lightness = p.shellFactor > 0.92 ? 84 : 68;
                    const alpha = (p.shellFactor > 0.85 ? 0.68 : 0.35) * twinkle * depthFade;

                    ctx.fillStyle = `hsla(${hue}, 95%, ${lightness}%, ${alpha * 0.38})`;
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, r * 2.2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = `hsla(${hue}, 100%, 92%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, r * 0.72, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'bokehOrb') {
                    const color = theme.fairyColors[p.colorIdx % theme.fairyColors.length];
                    const pulse = 0.5 + 0.5 * Math.sin(timeSec * p.twinkleSpeed + p.twinklePhase);
                    const radius = p.size * scale * (0.85 + pulse * 0.35);

                    const bokehGrad = ctx.createRadialGradient(x2d, y2d, 0, x2d, y2d, radius * 2.8);
                    bokehGrad.addColorStop(0, '#FFFFFF');
                    bokehGrad.addColorStop(0.25, color);
                    bokehGrad.addColorStop(0.65, color);
                    bokehGrad.addColorStop(1, 'rgba(0,0,0,0)');

                    ctx.globalAlpha = 0.55 * pulse * depthFade;
                    ctx.fillStyle = bokehGrad;
                    ctx.beginPath();
                    ctx.arc(x2d, y2d, radius * 2.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            drawEtherealRibbons(centerX, centerY, fov, theme, timeSec, false);
            drawFloatingWisps(centerX, centerY, fov, meta, theme, timeSec);

            ctx.restore();

            // 9. 绘制树顶虚幻八芒伯利恒之星（并记录其屏幕坐标供点击彩蛋检测）
            const starX = centerX + windVelocity * 14;
            const starY = centerY - meta.treeHeight * 0.5 - 12;
            topStarScreenPos = { x: starX, y: starY, radius: width < 640 ? 34 : 42 };
            drawTopStar(starX, starY, timeSec, theme.starColor);

            // 10. 更新并绘制许愿天灯
            for (let i = wishLanterns.length - 1; i >= 0; i--) {
                wishLanterns[i].update();
                wishLanterns[i].draw();
                if (wishLanterns[i].alpha <= 0 && wishLanterns[i].y < height * 0.2) {
                    wishLanterns.splice(i, 1);
                }
            }

            // 11. 绘制受微风吹拂的飘落雪花
            ctx.save();
            for (let i = 0; i < snowflakes.length; i++) {
                const sf = snowflakes[i];
                sf.y += sf.speedY;
                sf.driftPhase += 0.018;
                sf.x += Math.sin(sf.driftPhase) * sf.driftAmp + windVelocity * (0.4 + sf.depth * 1.4);

                if (sf.y > height + 6) {
                    sf.y = -6;
                    sf.x = Math.random() * width;
                }
                if (sf.x > width + 6) sf.x = -6;
                else if (sf.x < -6) sf.x = width + 6;

                ctx.fillStyle = `rgba(240, 248, 255, ${sf.opacity})`;
                ctx.beginPath();
                ctx.arc(sf.x, sf.y, sf.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            ctx.globalAlpha = 1;
        }

        // 绘制夜空上方流动的半透明北极光幕布
        function drawAuroraCurtains(timeSec, theme) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            for (let layer = 0; layer < 2; layer++) {
                const baseY = height * (0.14 + layer * 0.08);
                const amp = height * 0.045;
                const hue = layer === 0 ? theme.auroraHue1 : theme.auroraHue2;

                ctx.beginPath();
                ctx.moveTo(0, baseY);
                const segments = 18;
                for (let i = 0; i <= segments; i++) {
                    const x = (width / segments) * i;
                    const wave = Math.sin(i * 0.45 + timeSec * (0.42 + layer * 0.15) + layer) * amp
                               + Math.cos(i * 0.25 - timeSec * 0.28) * (amp * 0.5);
                    ctx.lineTo(x, baseY + wave);
                }
                ctx.lineTo(width, baseY + height * 0.18);
                ctx.lineTo(0, baseY + height * 0.18);
                ctx.closePath();

                const auroraGrad = ctx.createLinearGradient(0, baseY - amp, 0, baseY + height * 0.18);
                auroraGrad.addColorStop(0, `hsla(${hue}, 85%, 60%, 0)`);
                auroraGrad.addColorStop(0.35, `hsla(${hue}, 90%, 62%, 0.075)`);
                auroraGrad.addColorStop(0.75, `hsla(${(hue + 25) % 360}, 85%, 55%, 0.03)`);
                auroraGrad.addColorStop(1, `hsla(${hue}, 85%, 50%, 0)`);

                ctx.fillStyle = auroraGrad;
                ctx.fill();
            }

            ctx.restore();
        }

        function drawEtherealVeil(centerX, centerY, meta, theme) {
            const steps = 40;
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            ctx.moveTo(centerX + windVelocity * 12, centerY - meta.treeHeight * 0.5);
            for (let i = 1; i <= steps; i++) {
                const t = i / steps;
                const swayX = windVelocity * Math.pow(1 - t, 1.5) * 12;
                const r = meta.getEtherealRadius(t) * 0.94;
                const y = centerY - meta.treeHeight * 0.5 + t * meta.treeHeight;
                ctx.lineTo(centerX + r + swayX, y);
            }
            for (let i = steps; i >= 1; i--) {
                const t = i / steps;
                const swayX = windVelocity * Math.pow(1 - t, 1.5) * 12;
                const r = meta.getEtherealRadius(t) * 0.94;
                const y = centerY - meta.treeHeight * 0.5 + t * meta.treeHeight;
                ctx.lineTo(centerX - r + swayX, y);
            }
            ctx.closePath();

            const veilGrad = ctx.createLinearGradient(
                centerX, centerY - meta.treeHeight * 0.5,
                centerX, centerY + meta.treeHeight * 0.5
            );
            veilGrad.addColorStop(0, `hsla(${theme.spiritHue}, 95%, 78%, 0.16)`);
            veilGrad.addColorStop(0.55, `hsla(${theme.spiritHue}, 90%, 62%, 0.08)`);
            veilGrad.addColorStop(1, `hsla(${theme.spiritAccentHue}, 85%, 55%, 0.02)`);
            ctx.fillStyle = veilGrad;
            ctx.fill();
            ctx.restore();
        }

        function drawEtherealRibbons(centerX, centerY, fov, theme, timeSec, drawBackHalf) {
            for (let sIdx = 0; sIdx < ribbonStrips.length; sIdx++) {
                const strip = ribbonStrips[sIdx];
                for (let i = 0; i < strip.length - 1; i++) {
                    const p1 = strip[i];
                    const p2 = strip[i + 1];

                    const th1 = p1.angle + rotationAngle;
                    const th2 = p2.angle + rotationAngle;

                    const z1 = Math.sin(th1) * p1.radius;
                    const z2 = Math.sin(th2) * p2.radius;

                    const isBack = (z1 + z2) * 0.5 > 0;
                    if (isBack !== drawBackHalf) continue;

                    const sc1 = fov / (fov + z1);
                    const sc2 = fov / (fov + z2);

                    const sway1 = windVelocity * Math.pow(1 - p1.t, 1.5) * 14;
                    const sway2 = windVelocity * Math.pow(1 - p2.t, 1.5) * 14;

                    const x1 = centerX + (Math.cos(th1) * p1.radius + sway1) * sc1;
                    const y1 = centerY + p1.y * sc1;
                    const x2 = centerX + (Math.cos(th2) * p2.radius + sway2) * sc2;
                    const y2 = centerY + p2.y * sc2;

                    const wavePulse = 0.55 + 0.45 * Math.sin(p1.t * 16 - timeSec * 3.6 + sIdx * 2.1);
                    const ribbonW = (1.6 + p1.t * 3.4) * p1.widthScale * sc1;
                    const alphaScale = drawBackHalf ? 0.24 : 0.85;

                    ctx.strokeStyle = theme.ribbonColor;
                    ctx.globalAlpha = alphaScale * wavePulse;
                    ctx.lineWidth = ribbonW * 2.6;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    ctx.strokeStyle = theme.ribbonEdge;
                    ctx.globalAlpha = alphaScale * wavePulse * 0.9;
                    ctx.lineWidth = Math.max(0.8, ribbonW * 0.45);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawEtherealBaseRings(centerX, groundY, meta, theme, timeSec) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';

            const floorGlow = ctx.createRadialGradient(centerX, groundY, 4, centerX, groundY, meta.maxRadius * 1.55);
            floorGlow.addColorStop(0, theme.auraInner);
            floorGlow.addColorStop(0.5, theme.treeGlow);
            floorGlow.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = floorGlow;
            ctx.beginPath();
            ctx.ellipse(centerX, groundY, meta.maxRadius * 1.55, meta.maxRadius * 0.36, 0, 0, Math.PI * 2);
            ctx.fill();

            for (let rIdx = 0; rIdx < 3; rIdx++) {
                const wave = ((timeSec * 0.45 + rIdx * 0.33) % 1);
                const rx = meta.maxRadius * (0.45 + wave * 0.95);
                const ry = rx * 0.24;
                const alpha = (1 - wave) * 0.42;

                ctx.strokeStyle = `hsla(${theme.spiritHue}, 95%, 78%, ${alpha})`;
                ctx.lineWidth = 1.6 - wave * 0.8;
                ctx.beginPath();
                ctx.ellipse(centerX, groundY, rx, ry, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawFloatingWisps(centerX, centerY, fov, meta, theme, timeSec) {
            for (let i = 0; i < floatingWisps.length; i++) {
                const w = floatingWisps[i];
                w.t -= w.riseSpeed;
                w.angle += w.orbitSpeed;
                if (w.t < 0.02) {
                    w.t = 0.98;
                }

                const theta = w.angle + rotationAngle * 0.6;
                const r = meta.getEtherealRadius(w.t) * w.radialOffset;
                const y = -meta.treeHeight * 0.5 + w.t * meta.treeHeight;

                const x3d = Math.cos(theta) * r;
                const z3d = Math.sin(theta) * r;
                const scale = fov / (fov + z3d);

                const x2d = centerX + x3d * scale;
                const y2d = centerY + y * scale;

                const fadeEdge = Math.sin(w.t * Math.PI);
                const pulse = 0.5 + 0.5 * Math.sin(timeSec * 3.2 + w.phase);
                const alpha = fadeEdge * pulse * (z3d > 0 ? 0.35 : 0.85);
                const radius = w.size * scale;

                ctx.fillStyle = `hsla(${theme.spiritHue}, 100%, 82%, ${alpha * 0.35})`;
                ctx.beginPath();
                ctx.arc(x2d, y2d, radius * 2.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(x2d, y2d, radius * 0.75, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawTopStar(x, y, timeSec, starColor) {
            ctx.save();
            ctx.translate(x, y);

            const pulse = 1 + Math.sin(timeSec * 2.8) * 0.08;
            const isMobile = width < 640;
            const mainR = (isMobile ? 20 : 26) * pulse;
            const diagR = mainR * 0.64;
            const innerR = mainR * 0.26;

            const halo = ctx.createRadialGradient(0, 0, 2, 0, 0, mainR * 3.1);
            halo.addColorStop(0, 'rgba(255, 253, 225, 0.96)');
            halo.addColorStop(0.3, 'rgba(255, 218, 115, 0.45)');
            halo.addColorStop(0.65, 'rgba(255, 190, 75, 0.14)');
            halo.addColorStop(1, 'rgba(255, 180, 60, 0)');
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, mainR * 3.1, 0, Math.PI * 2);
            ctx.fill();

            const flareGradH = ctx.createLinearGradient(-mainR * 2.4, 0, mainR * 2.4, 0);
            flareGradH.addColorStop(0, 'rgba(255, 250, 220, 0)');
            flareGradH.addColorStop(0.5, 'rgba(255, 252, 235, 0.85)');
            flareGradH.addColorStop(1, 'rgba(255, 250, 220, 0)');
            ctx.fillStyle = flareGradH;
            ctx.fillRect(-mainR * 2.4, -1, mainR * 4.8, 2);

            const flareGradV = ctx.createLinearGradient(0, -mainR * 2.4, 0, mainR * 2.4);
            flareGradV.addColorStop(0, 'rgba(255, 250, 220, 0)');
            flareGradV.addColorStop(0.5, 'rgba(255, 252, 235, 0.85)');
            flareGradV.addColorStop(1, 'rgba(255, 250, 220, 0)');
            ctx.fillStyle = flareGradV;
            ctx.fillRect(-1, -mainR * 2.4, 2, mainR * 4.8);

            ctx.fillStyle = starColor;
            ctx.beginPath();
            const points = 16;
            for (let i = 0; i < points; i++) {
                let r = innerR;
                if (i % 4 === 0) r = mainR;
                else if (i % 2 === 0) r = diagR;
                const a = (i * Math.PI) / 8 - Math.PI / 2;
                const px = Math.cos(a) * r;
                const py = Math.sin(a) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(0, 0, innerR * 0.85, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        /**
         * ============================================================================
         * 6. 交互逻辑：流星捕捉彩蛋、树顶星星3连击彩蛋、滑动吹风与点击放烟花
         * ============================================================================
         */
        function handlePointerDown(clientX, clientY) {
            isDragging = true;
            dragStartX = clientX;
            dragStartY = clientY;
            lastDragX = clientX;
            dragMoved = false;
        }

        function handlePointerMove(clientX, clientY) {
            if (!isDragging) return;
            const dx = clientX - lastDragX;
            if (Math.abs(clientX - dragStartX) > 6 || Math.abs(clientY - dragStartY) > 6) {
                dragMoved = true;
            }
            rotationAngle += dx * 0.0085;
            angularVelocity = dx * 0.006;
            // 滑动掀起冬夜微风，带动雪花和树冠倾斜
            windVelocity = Math.max(-2.6, Math.min(2.6, windVelocity + dx * 0.032));
            lastDragX = clientX;
        }

        function handlePointerUp(clientX, clientY) {
            if (!isDragging) return;
            isDragging = false;
            if (dragMoved) return;

            // 检测 1：是否点中了夜空中划过的流星
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const st = shootingStars[i];
                const distToStar = Math.hypot(clientX - st.x, clientY - st.y);
                if (distToStar < 48 && !st.caught) {
                    st.caught = true;
                    shootingStars.splice(i, 1);
                    soundEngine.playChimeSparkle();
                    showToast('🌠 捕捉到流星！双子心形烟花为您绽放');
                    launchFireworkTo(clientX - 45, clientY, 'heart', 342);
                    launchFireworkTo(clientX + 45, clientY - 15, 'heart', 38);
                    return;
                }
            }

            // 检测 2：是否点中了树顶八芒星（连续点击 3 次解锁隐藏「香槟玫瑰金」主题）
            const distToTopStar = Math.hypot(clientX - topStarScreenPos.x, clientY - topStarScreenPos.y);
            if (distToTopStar <= topStarScreenPos.radius) {
                const now = performance.now();
                if (now - lastStarTapTime < 1500) {
                    starTapCount++;
                } else {
                    starTapCount = 1;
                }
                lastStarTapTime = now;

                // 星星受击星光爆发
                explodeFirework(topStarScreenPos.x, topStarScreenPos.y, 45, 'ring');

                if (starTapCount >= 3) {
                    starTapCount = 0;
                    if (!secretUnlocked) {
                        secretUnlocked = true;
                        availableThemes.push(SECRET_ROSE_GOLD_THEME);
                    }
                    currentThemeIdx = availableThemes.length - 1;
                    document.getElementById('themeNameLabel').textContent = availableThemes[currentThemeIdx].name;
                    soundEngine.playChimeSparkle();
                    showToast('👑 彩蛋解锁！已切换至隐藏「香槟玫瑰金」主题');
                    launchFireworkTo(width * 0.35, height * 0.22, 'heart', 342);
                    launchFireworkTo(width * 0.65, height * 0.22, 'heart', 342);
                } else {
                    showToast(`⭐ 星光共鸣 (${starTapCount}/3)...`);
                }
                return;
            }

            // 默认：在指尖点击处精准燃放烟花
            const targetY = Math.min(clientY, height * 0.68);
            launchFireworkTo(clientX, targetY);
        }

        canvas.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', (e) => handlePointerUp(e.clientX, e.clientY));

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                handlePointerUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
        });

        /**
         * ============================================================================
         * 7. 圣诞倒计时、星愿瓶存储、专属祝福链接解析与 UI 交互
         * ============================================================================
         */
        function updateChristmasCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let target = new Date(currentYear, 11, 25, 0, 0, 0); // 12月25日

            // 判断是否正是圣诞节当天
            if (now.getMonth() === 11 && now.getDate() === 25) {
                document.getElementById('countdownText').textContent = '🎄 今天就是圣诞节 · 愿你万事胜意！';
                return;
            }

            if (now > target) {
                target = new Date(currentYear + 1, 11, 25, 0, 0, 0);
            }

            const diff = target - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = String(Math.floor((diff / (1000 * 60 * 60)) % 24)).padStart(2, '0');
            const mins = String(Math.floor((diff / (1000 * 60)) % 60)).padStart(2, '0');
            const secs = String(Math.floor((diff / 1000) % 60)).padStart(2, '0');

            document.getElementById('countdownText').textContent = `距圣诞节 ${days}天 ${hours}:${mins}:${secs}`;
        }

        // 星尘许愿瓶本地存储管理
        const WISH_STORAGE_KEY = 'christmas_ethereal_wishes_v1';
        let savedWishes = [];

        function loadSavedWishes() {
            try {
                const raw = localStorage.getItem(WISH_STORAGE_KEY);
                savedWishes = raw ? JSON.parse(raw) : [];
            } catch (e) {
                savedWishes = [];
            }
            updateWishBottleBadge();
        }

        function saveWishToBottle(text) {
            const now = new Date();
            const timeStr = `${now.getMonth() + 1}月${now.getDate()}日 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            savedWishes.unshift({ text, time: timeStr });
            if (savedWishes.length > 30) savedWishes.pop();
            try {
                localStorage.setItem(WISH_STORAGE_KEY, JSON.stringify(savedWishes));
            } catch (e) {}
            updateWishBottleBadge();
        }

        function updateWishBottleBadge() {
            document.getElementById('wishCountBadge').textContent = savedWishes.length;
        }

        function renderWishBottleList() {
            const listEl = document.getElementById('wishHistoryList');
            if (savedWishes.length === 0) {
                listEl.innerHTML = `<div class="text-center text-xs text-blue-200/60 py-8">星愿瓶还是空的，快去放飞第一盏许愿天灯吧 🏮</div>`;
                return;
            }
            listEl.innerHTML = savedWishes.map((item, idx) => `
                <div class="p-3 rounded-2xl bg-white/8 border border-white/12 flex items-center justify-between gap-2">
                    <div>
                        <div class="text-sm text-amber-100 font-medium">🏮 ${escapeHtml(item.text)}</div>
                        <div class="text-[11px] text-blue-200/60 mt-0.5">${item.time}</div>
                    </div>
                    <button type="button" data-wish-idx="${idx}" class="relaunch-single-wish text-xs px-2.5 py-1 rounded-full bg-amber-400/20 hover:bg-amber-400/35 text-amber-200 border border-amber-300/30 shrink-0 cursor-pointer">
                        再放飞
                    </button>
                </div>
            `).join('');

            listEl.querySelectorAll('.relaunch-single-wish').forEach((btn) => {
                btn.addEventListener('click', () => {
                    const idx = Number(btn.getAttribute('data-wish-idx'));
                    const wish = savedWishes[idx];
                    if (wish) {
                        wishLanterns.push(new WishLantern(wish.text));
                        closeBottleModal();
                        showToast('🏮 心愿天灯再次升空！');
                    }
                });
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
        }

        // 解析 URL 专属祝福参数 (?to=...&msg=...)
        function checkCustomGreetingFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const toName = params.get('to');
            const msgText = params.get('msg');

            if (toName || msgText) {
                const banner = document.getElementById('greetingCardBanner');
                const titleEl = document.getElementById('greetingToTitle');
                const bodyEl = document.getElementById('greetingMsgBody');

                const safeTo = toName ? toName.trim().slice(0, 16) : '特别的你';
                const safeMsg = msgText ? msgText.trim().slice(0, 48) : '愿这个冬夜的烟花与星光，为你照亮新一年的所有美好！';

                titleEl.textContent = `To: ${safeTo}`;
                bodyEl.textContent = safeMsg;
                banner.classList.remove('hidden');

                // 自动放飞写有祝福语的天灯与心形烟花
                setTimeout(() => {
                    wishLanterns.push(new WishLantern(`送给${safeTo}：${safeMsg.slice(0, 16)}`));
                    launchFireworkTo(width * 0.34, height * 0.24, 'heart', 342);
                    launchFireworkTo(width * 0.66, height * 0.24, 'heart', 38);
                }, 750);
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toastMsg');
            toast.firstElementChild.textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2400);
        }

        // 音频开关
        document.getElementById('audioToggleBtn').addEventListener('click', () => {
            const playing = soundEngine.toggle();
            document.getElementById('audioIcon').textContent = playing ? '🎵' : '🔇';
            document.getElementById('audioText').textContent = playing ? '音乐开启' : '开启音乐';
            showToast(playing ? '🎄 圣诞八音盒与烟花音效已开启' : '🔇 已静音');
        });

        // 纯净观赏模式
        let uiVisible = true;
        document.getElementById('toggleUiBtn').addEventListener('click', () => {
            uiVisible = !uiVisible;
            const headerTitle = document.getElementById('headerTitle');
            const controlDock = document.getElementById('controlDock');
            const toggleUiText = document.getElementById('toggleUiText');

            if (uiVisible) {
                headerTitle.classList.remove('ui-hidden');
                controlDock.classList.remove('ui-hidden');
                toggleUiText.textContent = '纯净模式';
            } else {
                headerTitle.classList.add('ui-hidden');
                controlDock.classList.add('ui-hidden');
                toggleUiText.textContent = '显示面板';
            }
        });

        // 15秒一键烟花盛典按钮
        document.getElementById('galaShowBtn').addEventListener('click', () => {
            if (galaActive) {
                stopGalaShow();
                showToast('🎆 已结束盛典连发');
            } else {
                startGalaShow(15000);
                showToast('🎆 开启 15 秒圣诞烟花盛典！');
            }
        });

        // 切换圣诞树灯光主题
        document.getElementById('themeSwitchBtn').addEventListener('click', () => {
            currentThemeIdx = (currentThemeIdx + 1) % availableThemes.length;
            const theme = availableThemes[currentThemeIdx];
            document.getElementById('themeNameLabel').textContent = theme.name;
            showToast(`✨ 已切换至「${theme.name}」主题`);
        });

        // 许愿灯弹窗交互
        const wishModal = document.getElementById('wishModal');
        const wishInput = document.getElementById('wishInput');

        document.getElementById('openWishBtn').addEventListener('click', () => {
            wishModal.classList.remove('hidden');
            wishModal.classList.add('flex');
            setTimeout(() => wishInput.focus(), 80);
        });

        function closeWishModal() {
            wishModal.classList.add('hidden');
            wishModal.classList.remove('flex');
        }

        document.getElementById('cancelWishBtn').addEventListener('click', closeWishModal);
        wishModal.addEventListener('click', (e) => {
            if (e.target === wishModal) closeWishModal();
        });

        document.querySelectorAll('.quick-wish').forEach((btn) => {
            btn.addEventListener('click', () => {
                wishInput.value = btn.textContent.trim();
            });
        });

        function releaseWish() {
            const text = wishInput.value.trim() || '圣诞快乐，平安喜乐 ✨';
            wishLanterns.push(new WishLantern(text));
            saveWishToBottle(text);
            wishInput.value = '';
            closeWishModal();
            showToast('🏮 心愿天灯已升空，并存入星愿瓶！');
            launchFireworkTo(width * 0.5, height * 0.24, 'heart', 38);
        }

        document.getElementById('sendWishBtn').addEventListener('click', releaseWish);
        wishInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') releaseWish();
        });

        // 星尘许愿瓶弹窗交互
        const bottleModal = document.getElementById('bottleModal');
        function closeBottleModal() {
            bottleModal.classList.add('hidden');
            bottleModal.classList.remove('flex');
        }
        document.getElementById('openBottleBtn').addEventListener('click', () => {
            renderWishBottleList();
            bottleModal.classList.remove('hidden');
            bottleModal.classList.add('flex');
        });
        document.getElementById('closeBottleBtn').addEventListener('click', closeBottleModal);
        bottleModal.addEventListener('click', (e) => {
            if (e.target === bottleModal) closeBottleModal();
        });
        document.getElementById('relaunchAllWishesBtn').addEventListener('click', () => {
            if (savedWishes.length === 0) {
                showToast('🫙 星愿瓶里还没有心愿哦');
                return;
            }
            const batch = savedWishes.slice(0, 6);
            batch.forEach((item, i) => {
                setTimeout(() => {
                    wishLanterns.push(new WishLantern(item.text));
                }, i * 550);
            });
            closeBottleModal();
            showToast(`🏮 正在重放 ${batch.length} 盏星愿天灯！`);
        });

        // 专属祝福链接生成器弹窗交互
        const shareModal = document.getElementById('shareModal');
        const shareToInput = document.getElementById('shareToInput');
        const shareMsgInput = document.getElementById('shareMsgInput');
        const generatedShareUrl = document.getElementById('generatedShareUrl');

        function updateGeneratedShareUrl() {
            const baseUrl = window.location.origin + window.location.pathname;
            const url = new URL(baseUrl.startsWith('http') ? baseUrl : 'https://example.com/');
            const toVal = shareToInput.value.trim();
            const msgVal = shareMsgInput.value.trim();
            if (toVal) url.searchParams.set('to', toVal);
            if (msgVal) url.searchParams.set('msg', msgVal);

            if (!baseUrl.startsWith('http')) {
                const qs = url.search;
                generatedShareUrl.value = `${window.location.href.split('?')[0]}${qs}`;
            } else {
                generatedShareUrl.value = url.toString();
            }
        }

        document.getElementById('openShareBtn').addEventListener('click', () => {
            updateGeneratedShareUrl();
            shareModal.classList.remove('hidden');
            shareModal.classList.add('flex');
        });

        function closeShareModal() {
            shareModal.classList.add('hidden');
            shareModal.classList.remove('flex');
        }

        document.getElementById('cancelShareBtn').addEventListener('click', closeShareModal);
        shareModal.addEventListener('click', (e) => {
            if (e.target === shareModal) closeShareModal();
        });

        shareToInput.addEventListener('input', updateGeneratedShareUrl);
        shareMsgInput.addEventListener('input', updateGeneratedShareUrl);

        document.getElementById('copyShareUrlBtn').addEventListener('click', () => {
            updateGeneratedShareUrl();
            generatedShareUrl.select();
            generatedShareUrl.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast('📋 专属祝福链接已复制！快发给TA吧');
                closeShareModal();
            } catch (e) {
                showToast('请长按或全选上方链接进行复制');
            }
        });

        // 专属祝福卡片操作
        document.getElementById('closeGreetingBannerBtn').addEventListener('click', () => {
            document.getElementById('greetingCardBanner').classList.add('hidden');
        });
        document.getElementById('replayGreetingFireworkBtn').addEventListener('click', () => {
            launchFireworkTo(width * 0.34, height * 0.24, 'heart', 342);
            launchFireworkTo(width * 0.66, height * 0.24, 'heart', 38);
        });

        // 窗口尺寸变化监听与页面初始化
        window.addEventListener('resize', resizeCanvas);
        window.onload = function () {
            resizeCanvas();
            loadSavedWishes();
            updateChristmasCountdown();
            setInterval(updateChristmasCountdown, 1000);
            checkCustomGreetingFromUrl();

            // 开场礼花欢迎
            setTimeout(() => {
                launchFireworkTo(width * 0.32, height * 0.25);
                launchFireworkTo(width * 0.68, height * 0.22);
            }, 400);

            requestAnimationFrame(render);
        };
    </script>
</body>
